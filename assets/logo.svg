<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Track Eye">
  <defs>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5C4D"/>
      <stop offset="1" stop-color="#FF8A7A"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5C4D"/>
      <stop offset="1" stop-color="#FFB8AE"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="160" rx="28" fill="#070708"/>
  <g transform="translate(40 32)">
    <path d="M8 48c12-18 25-27 40-27s28 9 40 27c-12 18-25 27-40 27S20 66 8 48z" fill="none" stroke="#F5F4F1" stroke-width="4.5"/>
    <circle cx="48" cy="48" r="15" fill="url(#iris)" filter="url(#glow)"/>
    <circle cx="48" cy="48" r="6" fill="#070708"/>
  </g>
  <text x="160" y="96" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="56" font-weight="700" letter-spacing="8" fill="#F5F4F1">TRACK <tspan fill="url(#word)">EYE</tspan></text>
  <text x="164" y="128" font-family="'JetBrains Mono','Inter',monospace" font-size="15" letter-spacing="3" fill="#8A8A92">RAIO-X DE RASTREAMENTO DE LANDING PAGES</text>
</svg>

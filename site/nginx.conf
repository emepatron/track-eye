server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTTPS é terminado pelo Traefik do Coolify; o site só é público por https, então o HSTS é seguro.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'none'; frame-ancestors 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /github {
        return 302 https://github.com/emepatron/track-eye;
    }
    location = /download {
        return 302 https://github.com/emepatron/track-eye/archive/refs/heads/main.zip;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
